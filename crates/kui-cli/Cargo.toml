[package]
name = "kui-cli"
version = "0.1.0"
edition = "2021"
authors = ["babar-xagi <babar.xagi@gmail.com>"]
description = "High-performance native CLI bootstrapper and orchestrator for KUI & UI4"

[lib]
name = "kui_cli"
path = "src/lib.rs"

[[bin]]
name = "kui"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
colored = "2.1"
kui-packager = { path = "../kui-packager" }

[dev-dependencies]
tempfile = "3.10"
