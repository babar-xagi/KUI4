[package]
name = "kui-packager"
version = "0.3.0"
edition = "2021"
authors = ["babar-xagi <babar.xagi@gmail.com>"]
description = "Native Android APK packager, AXML emitter, and APK Signature Scheme v2 signer in pure Rust"

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1.4"
flate2 = "1.0"
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["std"] }
rand = "0.8"
kui-dex = { path = "../kui-dex" }

[dev-dependencies]
tempfile = "3.10"
