name: Publish Kotlin Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler
        run: |
          choco install kotlinc -y --no-progress
          "C:\tools\kotlinc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run every Kotlin suite
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_all.ps1
      - name: Build sample APK
        working-directory: examples/hello
        run: ..\..\kui.bat build --clean
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build Kotlin MSI and portable package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_msi.ps1
      - uses: softprops/action-gh-release@v2
        with:
          name: "KUI Kotlin ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/kui-*.msi
            dist/kui-*.msi.sha256
            dist/kui-*.zip
            dist/kui-*.zip.sha256