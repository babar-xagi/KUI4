name: Publish Kotlin Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler
        shell: powershell
        run: |
          $KotlinVersion = '2.4.20'
          $Configured = [regex]::Match([IO.File]::ReadAllText((Join-Path $PWD 'kui.toml')), '(?m)^kotlin_version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($Configured -ne $KotlinVersion) { throw 'Update the pinned compiler and checksum to match kui.toml.' }
          $Zip = Join-Path $env:RUNNER_TEMP "kotlin-compiler-$KotlinVersion.zip"
          $Tools = Join-Path $env:RUNNER_TEMP "kui-kotlin-$KotlinVersion"
          Invoke-WebRequest -UseBasicParsing "https://github.com/JetBrains/kotlin/releases/download/v$KotlinVersion/kotlin-compiler-$KotlinVersion.zip" -OutFile $Zip
          . .\scripts\kotlin_tools.ps1
          if ((Get-KuiFileHash $Zip) -ne '59E9CA74C7904EF2C122B12114937673CCCE68DE820A663F0ED66CCF8799E0B7') { throw 'Kotlin compiler checksum mismatch.' }
          Expand-Archive -LiteralPath $Zip -DestinationPath $Tools
          "$(Join-Path $Tools 'kotlinc\bin')" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "KOTLIN_HOME=$(Join-Path $Tools 'kotlinc')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate tag and CLI versions
        id: version
        shell: powershell
        run: |
          $VersionOutput = @(& .\kui.bat version)
          if ($LASTEXITCODE -ne 0) { throw 'Kotlin CLI could not start.' }
          $VersionLine = $VersionOutput | Where-Object { $_ -match '^kui version [0-9]+\.[0-9]+\.[0-9]+$' } | Select-Object -Last 1
          if (-not $VersionLine) { throw 'Kotlin CLI did not report a version.' }
          $Actual = $VersionLine -replace '^kui version ', ''
          $Tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($Tag -match '^(\d+)\.(\d+)$') { $Tag = '{0}.{1}.0' -f [int]$Matches[1], [int]$Matches[2] }
          if ($Tag -ne $Actual) { throw "Tag version $Tag does not match CLI $Actual." }
          $Label = $env:GITHUB_REF_NAME -replace '^v', ''
          $Notes = "docs/releases/$Label.md"
          if (-not (Test-Path -LiteralPath $Notes)) { throw "Release notes are missing: $Notes" }
          "KUI_PACKAGE_VERSION=$Actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KUI_RELEASE_LABEL=$Label" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KUI_RELEASE_NOTES=$Notes" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run every Kotlin suite
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test_all.ps1
      - name: Build sample APK
        working-directory: examples/hello
        run: ..\..\kui.bat build --clean
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build Kotlin MSI and portable package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_msi.ps1
      - name: Verify release packages
        shell: powershell
        run: |
          $Msi = 'dist/kui-{0}-windows-x64.msi' -f $env:KUI_PACKAGE_VERSION
          & .\scripts\verify_distribution.ps1 -MsiPath $Msi
      - name: Stage greeting APK
        shell: powershell
        run: |
          $Name = 'hello-{0}-debug.apk' -f $env:KUI_PACKAGE_VERSION
          $Target = Join-Path $PWD "dist/$Name"
          Copy-Item examples/hello/build/outputs/apk/debug/app-debug.apk $Target
          . .\scripts\kotlin_tools.ps1
          $Hash = Get-KuiFileHash $Target
          [IO.File]::WriteAllText("$Target.sha256", "$Hash  $Name")
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-logs
          path: .kui/verification/*.log
      - name: Publish tested Kotlin release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 KUI ${{ env.KUI_RELEASE_LABEL }} — Kotlin-only"
          body_path: ${{ env.KUI_RELEASE_NOTES }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/kui-${{ env.KUI_PACKAGE_VERSION }}-windows-x64.msi
            dist/kui-${{ env.KUI_PACKAGE_VERSION }}-windows-x64.msi.sha256
            dist/kui-${{ env.KUI_PACKAGE_VERSION }}-windows.zip
            dist/kui-${{ env.KUI_PACKAGE_VERSION }}-windows.zip.sha256
            dist/hello-${{ env.KUI_PACKAGE_VERSION }}-debug.apk
            dist/hello-${{ env.KUI_PACKAGE_VERSION }}-debug.apk.sha256
